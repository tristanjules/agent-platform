# DUSTY Burning Man Configuration
# Fully offline, power-conscious settings

[agent]
name = "DUSTY"
personality = "philosopher"
wake_word = "hey dusty"
max_history = 30  # Smaller history to save memory

[inference]
mode = "local"  # Offline only — no cloud fallback

[inference.local]
provider = "ollama"
model = "gemma3:1b"  # Best efficiency/quality ratio on Pi 5
endpoint = "http://localhost:11434"

[inference.cloud]
provider = "anthropic"
model = "claude-sonnet-4-20250514"

[audio]
sample_rate = 16000
channels = 1
vad_threshold = 0.025  # Slightly higher threshold for noisy playa environment
silence_ms = 1000       # Longer silence timeout — noisy environments have gaps
max_segment_sec = 30

[stt]
engine = "whisper"
model = "tiny"  # Faster, less CPU for battery life
language = "en"

[tts]
engine = "piper"
default_voice = "philosopher"
piper_bin = "piper"

[tts.voices.philosopher]
model = "assets/voices/en_US-lessac-medium.onnx"
speaking_rate = 0.95
description = "Warm, contemplative voice for deep conversations"

[display]
mode = "tui"
theme = "phosphor-green"

[display.visual]
resolution = [128, 128]  # Lower res for power saving
palette = "16-retro"
crt_shader = false  # Save GPU cycles

[memory]
persist = true
path = "dusty.memory.json"

# ─── Mesh Communications (AfrikaBurn / LoRa) ─────────────────────────────────
[mesh]
enabled = true
serial_port = "/dev/ttyUSB0"
baud_rate = 115200
node_id = ""        # Set to your Meshtastic node ID, e.g. "!abcd1234"
agent_name = ""     # Defaults to agent.name
owner_name = ""     # Your name, broadcast to other agents during discovery
psk = ""            # Set to your shared AES-256 PSK (hex)

heartbeat_interval = "5m"
discovery_timeout  = "30s"
peer_ttl           = "30m"
queue_size         = 16
rate_limit_secs    = 30      # LoRa duty-cycle: at most 1 msg per 30s
idle_timeout_mins  = 5

message_retention  = 200
interaction_limit  = 100

peers_file        = "mesh-peers.json"
peer_memory_file  = "mesh-peer-memory.json"
messages_file     = "mesh-messages.json"
sound_file        = "assets/sounds/transmission.wav"

# AfrikaBurn GPS coordinates (Tankwa Town, Northern Cape).
# Update to your actual camp location once on-playa.
gps_lat = -32.3279
gps_lon = 19.7485

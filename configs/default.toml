# DUSTY Default Configuration

[agent]
name = "DUSTY"
personality = "philosopher"
wake_word = "hey dusty"
max_history = 50

[inference]
mode = "local"  # "local", "cloud", "auto"

[inference.local]
provider = "ollama"
model = "gemma3:1b"
endpoint = "http://localhost:11434"

[inference.cloud]
provider = "anthropic"
model = "claude-sonnet-4-20250514"
# API key loaded from env: ANTHROPIC_API_KEY

# ─── Intent Classifier (optional) ────────────────────────────────────────────
# Enables pre-LLM intent classification and training data collection.
# The classifier determines whether a message needs tool calling before it
# reaches the model, enabling model-per-intent routing.
#
# Phase 1: set enabled=true with a single model to collect training data.
# Phase 2: set tool_model + chat_model to route intents to specialised models.
# Phase 3: replace the rule-based classifier with a fine-tuned model.
#
# [inference.classifier]
# enabled = false
# tool_model = "qwen2.5:1.5b"      # model used when tool call is detected
# chat_model = "llama3.2:1b"        # model used for pure conversation
# confidence_threshold = 0.7         # below this, use default model with tools
# training_data_path = "data/training/tool_calls.jsonl"  # empty = disabled

[audio]
sample_rate = 16000
channels = 1
# input_device = ""   # leave empty for system default
# output_device = ""  # leave empty for system default
vad_threshold = 0.02
silence_ms = 800
max_segment_sec = 30

[stt]
engine = "whisper"
model = "base"  # tiny, base, small
language = "en"

[tts]
engine = "piper"
default_voice = "philosopher"
piper_bin = "piper"  # must be on PATH or set to absolute path, e.g. "bin/piper"

[tts.voices.philosopher]
model = "assets/voices/en_US-lessac-medium.onnx"
speaking_rate = 0.95
description = "Warm, contemplative voice for deep conversations"

[tts.voices.robot]
model = "assets/voices/en_US-ryan-medium.onnx"
speaking_rate = 1.0
description = "Crisp, slightly robotic delivery"

[display]
mode = "tui"  # "tui", "visual", "both"
theme = "phosphor-green"  # "phosphor-green", "amber", "blue", "custom"

[display.visual]
resolution = [256, 256]
palette = "16-retro"
crt_shader = true

[memory]
persist = true
path = "dusty.memory.json"

# ─── Mesh Communications (LoRa / Meshtastic) ─────────────────────────────────
# Requires a Meshtastic-compatible LoRa node (e.g. LILYGO T-Beam) connected
# via USB serial. Set enabled = true and configure your node_id + psk.
[mesh]
enabled = false
serial_port = "/dev/ttyUSB0"        # USB serial port of the LoRa node
baud_rate = 115200

# Your Meshtastic node ID, e.g. "!abcd1234"
node_id = ""

# Name announced to peer agents during discovery (defaults to agent.name if empty)
agent_name = ""
owner_name = ""  # Human owner name broadcast in discovery heartbeats

# AES-256 pre-shared key (hex) for the encrypted Meshtastic channel.
# Must match on all nodes in the mesh.
psk = ""

# How often to broadcast a heartbeat to keep peers aware of this node.
heartbeat_interval = "5m"

# How long to wait for peer responses during startup discovery.
discovery_timeout = "30s"

# How long before a peer with no heartbeat is considered lost.
peer_ttl = "30m"

# Outbound message queue depth. Messages are dropped (oldest first) when full.
queue_size = 16

# Minimum seconds between outbound transmissions (LoRa duty-cycle protection).
rate_limit_secs = 30

# Minutes of user inactivity before overlay is suppressed and messages queued silently.
idle_timeout_mins = 5

# Maximum number of messages to retain in the persistent inbox.
message_retention = 200

# Maximum interaction history entries to store per peer.
interaction_limit = 100

# Persistent state files.
peers_file         = "mesh-peers.json"
peer_memory_file   = "mesh-peer-memory.json"
messages_file      = "mesh-messages.json"
sound_file         = "assets/sounds/transmission.wav"

# GPS stub: fixed coordinates broadcast in heartbeats (decimal degrees).
# Leave at 0.0 if you have no GPS fix.
gps_lat = 0.0
gps_lon = 0.0

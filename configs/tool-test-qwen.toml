# DUSTY Tool Calling Test — Qwen 2.5 1.5B
# Qwen 2.5 is specifically trained for function calling and structured output.
# Recommended model for tool calling on Pi 5.

[agent]
name = "DUSTY"
personality = "philosopher"
wake_word = "hey dusty"
max_history = 50

[inference]
mode = "local"

[inference.local]
provider = "ollama"
# Tool calling: EXCELLENT — recommended for mesh tool use
model = "qwen2.5:1.5b"
endpoint = "http://localhost:11434"

[inference.cloud]
provider = "anthropic"
model = "claude-sonnet-4-20250514"

[memory]
persist = false
path = ""

# Classifier routing: qwen for everything (baseline for tool-only model)
[inference.classifier]
enabled = true
tool_model = "qwen2.5:1.5b"
chat_model = "qwen2.5:1.5b"
confidence_threshold = 0.7
training_data_path = "data/training/tool_calls.jsonl"

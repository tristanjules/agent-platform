# DUSTY Tool Calling Test — Llama 3.2 1B (classifier gating, single model)
# Tests the impact of the rule-based classifier gating tool injection,
# but using the SAME model for both tool and chat (no model routing).

[agent]
name = "DUSTY"
personality = "philosopher"
wake_word = "hey dusty"
max_history = 50

[inference]
mode = "local"

[inference.local]
provider = "ollama"
model = "llama3.2:1b"
endpoint = "http://localhost:11434"

[inference.cloud]
provider = "anthropic"
model = "claude-sonnet-4-20250514"

[memory]
persist = false
path = ""

# Classifier enabled, but both models are llama — tests gating without routing
[inference.classifier]
enabled = true
tool_model = "llama3.2:1b"
chat_model = "llama3.2:1b"
confidence_threshold = 0.7
training_data_path = "data/training/tool_calls.jsonl"
